<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Wedding Invitation</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Jost:wght@300;400;500&family=Noto+Nastaliq+Urdu:wght@500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0b2a22;
            --bg2: #06180f;
            --gold: #e0b862;
            --gold2: #f6e3a8;
            --ivory: #fbf4e3;
            --maroon: #6e1424;
            --maroon2: #3d0a14;
            --marigold: #f2a321;
            --muted: #cfc6ad;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px);
            height: 100%
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            height: 100%;
            background: var(--bg2);
            color: var(--ivory);
            font-family: 'Jost', system-ui, sans-serif;
            overflow: hidden
        }

        #deck {
            height: 100%;
            overflow-y: auto;
            scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth
        }

        .slide {
            min-height: 100svh;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 48px 22px 56px;
            position: relative;
            overflow: hidden
        }

        .slide::before {
            content: "";
            position: absolute;
            inset: 0;
            opacity: .07;
            pointer-events: none;
            background-image: radial-gradient(var(--gold) 1.2px, transparent 1.5px), radial-gradient(var(--gold) 1.2px, transparent 1.5px);
            background-size: 34px 34px;
            background-position: 0 0, 17px 17px
        }

        .day {
            background: radial-gradient(ellipse at 50% 38%, #fffdf6 0%, #f8efd8 55%, #e6d6a8 100%);
            padding-top: 34px
        }

        .day .urdu,
        .day .blessing,
        .day .hint {
            color: #8a6a1c
        }

        .day .kicker {
            color: #6b6350
        }

        .day .sub {
            color: #5b5442;
            font-size: 17px
        }

        .day .names {
            color: #0b3d2e;
            font-size: clamp(34px, 11vw, 50px);
            margin: 4px 0
        }

        .day .amp {
            color: #b08a2e
        }

        .day .orn {
            color: #b08a2e;
            margin: 8px 0
        }

        .day .blessing {
            margin: 0 0 6px;
            font-size: 17px
        }

        .day .bismillah {
            line-height: 1.7
        }

        .couple-wrap {
            width: min(66vw, 250px);
            margin: 4px auto
        }

        .couple-wrap svg {
            width: 100%;
            height: auto;
            display: block;
            overflow: visible
        }

        .couple {
            animation: float 4s ease-in-out infinite
        }

        @keyframes float {
            50% {
                transform: translateY(-5px)
            }
        }

        .glow {
            animation: pulse 3.5s ease-in-out infinite
        }

        @keyframes pulse {
            50% {
                opacity: .45
            }
        }

        .heart {
            fill: #c2334d;
            opacity: 0;
            animation: rise 3.6s ease-in infinite
        }

        .heart:nth-of-type(2) {
            animation-delay: 1.2s
        }

        .heart:nth-of-type(3) {
            animation-delay: 2.4s
        }

        @keyframes rise {
            0% {
                transform: translateY(8px);
                opacity: 0
            }

            30% {
                opacity: 1
            }

            100% {
                transform: translateY(-26px);
                opacity: 0
            }
        }

        .sp {
            fill: #e0b862;
            animation: tw 2.4s ease-in-out infinite
        }

        .sp:nth-of-type(2n) {
            animation-delay: .8s
        }

        .sp:nth-of-type(3n) {
            animation-delay: 1.5s
        }

        @keyframes tw {
            50% {
                opacity: .15
            }
        }

        .petals {
            position: absolute !important;
            inset: 0;
            pointer-events: none;
            transform: none !important
        }

        .petals span {
            position: absolute;
            top: -24px;
            opacity: .7;
            animation: fall linear infinite
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg)
            }
        }

        .slide>* {
            position: relative;
            z-index: 1;
            opacity: 0;
            transform: translateY(26px);
            transition: opacity .9s ease, transform .9s ease
        }

        .slide.in>* {
            opacity: 1;
            transform: none
        }

        .slide.in>*:nth-child(2) {
            transition-delay: .15s
        }

        .slide.in>*:nth-child(3) {
            transition-delay: .3s
        }

        .slide.in>*:nth-child(4) {
            transition-delay: .45s
        }

        .slide.in>*:nth-child(5) {
            transition-delay: .6s
        }

        .urdu {
            font-family: 'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', serif;
            color: var(--gold);
            line-height: 2
        }

        .bismillah {
            font-size: clamp(22px, 6.5vw, 30px)
        }

        .blessing {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 19px;
            color: var(--gold2);
            margin: 6px 0 26px
        }

        .kicker {
            letter-spacing: .32em;
            text-transform: uppercase;
            font-size: 11px;
            color: var(--muted)
        }

        .names {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 700;
            font-size: clamp(40px, 13vw, 60px);
            line-height: 1.05;
            color: var(--ivory);
            margin: 8px 0
        }

        .names .amp {
            display: block;
            font-style: italic;
            font-weight: 500;
            color: var(--gold);
            font-size: .55em;
            margin: 4px 0
        }

        .orn {
            color: var(--gold);
            letter-spacing: .5em;
            font-size: 14px;
            margin: 16px 0
        }

        .sub {
            font-family: 'Cormorant Garamond', serif;
            font-size: 19px;
            color: var(--muted);
            max-width: 300px;
            line-height: 1.5
        }

        .hint {
            position: absolute !important;
            bottom: calc(18px + env(safe-area-inset-bottom, 0px));
            left: 50%;
            transform: translateX(-50%) !important;
            font-size: 11px;
            letter-spacing: .25em;
            color: var(--gold);
            text-transform: uppercase;
            animation: bob 2s infinite
        }

        @keyframes bob {
            50% {
                margin-bottom: 8px
            }
        }

        h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            color: var(--gold);
            margin-bottom: 6px
        }

        .group {
            margin: 18px 0;
            width: 100%;
            max-width: 340px
        }

        .group h3 {
            font-size: 12px;
            letter-spacing: .3em;
            text-transform: uppercase;
            color: var(--gold2);
            margin-bottom: 10px;
            font-weight: 500
        }

        .group p {
            font-family: 'Cormorant Garamond', serif;
            font-size: 22px;
            line-height: 1.55
        }

        .arch {
            width: 100%;
            max-width: 340px;
            border: 1.5px solid var(--gold);
            border-radius: 170px 170px 26px 26px;
            padding: 46px 22px 34px;
            background: rgba(255, 255, 255, .05);
            box-shadow: 0 0 0 6px rgba(224, 184, 98, .12), 0 18px 50px rgba(0, 0, 0, .4)
        }

        .arch .urdu {
            font-size: 26px;
            line-height: 1.6
        }

        .arch h2 {
            font-size: 40px;
            color: var(--ivory)
        }

        .date {
            font-family: 'Cormorant Garamond', serif;
            font-size: 26px;
            color: var(--gold2);
            margin-top: 14px
        }

        .time {
            font-size: 14px;
            letter-spacing: .2em;
            color: var(--muted);
            margin-top: 2px
        }

        .venue {
            margin-top: 16px;
            font-size: 15px;
            line-height: 1.55;
            color: var(--ivory)
        }

        .venue b {
            display: block;
            font-family: 'Cormorant Garamond', serif;
            font-size: 22px;
            color: var(--gold)
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 11px 26px;
            border: 1px solid var(--gold);
            border-radius: 40px;
            color: var(--gold);
            text-decoration: none;
            font-size: 12px;
            letter-spacing: .2em;
            text-transform: uppercase
        }

        .btn:active {
            background: var(--gold);
            color: var(--bg2)
        }

        .note {
            margin-top: 14px;
            font-size: 13px;
            color: var(--muted);
            font-style: italic
        }

        .dots {
            position: fixed;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 9
        }

        .dots i {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(224, 184, 98, .35);
            transition: .3s
        }

        .dots i.on {
            background: var(--gold);
            transform: scale(1.5)
        }

        .day .bismillah {
            margin-bottom: 22px
        }

        .day .blessing {
            margin-bottom: 12px
        }

        .day .arch {
            background: rgba(255, 255, 255, .7);
            border-color: #c9a23f;
            box-shadow: 0 0 0 6px rgba(201, 162, 63, .18), 0 14px 36px rgba(120, 90, 20, .18)
        }

        .day .arch .urdu,
        .day .date {
            color: #8a6a1c
        }

        .day .arch h2,
        .day .venue b {
            color: #0b3d2e
        }

        .day .time,
        .day .note {
            color: #6b6350
        }

        .day .venue {
            color: #3b3526
        }

        .day .btn {
            color: #8a6a1c;
            border-color: #b08a2e
        }

        .s-mehndi.night {
            background: linear-gradient(180deg, #03140f 0%, #0a2a3a 55%, #10224f 100%)
        }

        .s-walima.night {
            background: linear-gradient(180deg, #050a24 0%, #141a52 55%, #2a1458 100%)
        }

        .stars {
            position: absolute !important;
            inset: 0;
            pointer-events: none;
            transform: none !important;
            z-index: 0 !important
        }

        .stars span {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 6px #fff
        }

        @keyframes twk {

            0%,
            100% {
                opacity: .15
            }

            50% {
                opacity: 1
            }
        }

        @keyframes drift {
            to {
                transform: translate(-22px, 14px)
            }
        }

        .stars i.shoot {
            position: absolute;
            width: 90px;
            height: 2px;
            background: linear-gradient(270deg, rgba(255, 255, 255, 0), #fff);
            opacity: 0;
            animation: shoot 9s ease-in infinite
        }

        @keyframes shoot {
            0% {
                opacity: 0;
                transform: translate(0, 0) rotate(-30deg)
            }

            3% {
                opacity: 1
            }

            12% {
                opacity: 0;
                transform: translate(-260px, 150px) rotate(-30deg)
            }

            100% {
                opacity: 0
            }
        }

        .stars b.moon {
            position: absolute;
            top: 26px;
            right: 24px;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            box-shadow: inset -13px -3px 0 0 #f6e3a8;
            filter: drop-shadow(0 0 10px rgba(246, 227, 168, .55))
        }

        .blink {
            animation: blink 5s infinite;
            transform-box: fill-box;
            transform-origin: center
        }

        @keyframes blink {

            0%,
            94%,
            100% {
                transform: scaleY(1)
            }

            97% {
                transform: scaleY(.1)
            }
        }

        .veil {
            animation: vs 4s ease-in-out infinite;
            transform-box: view-box;
            transform-origin: 206px 40px
        }

        @keyframes vs {
            50% {
                transform: rotate(1.6deg)
            }
        }

        .sway {
            animation: sw 3.4s ease-in-out infinite;
            transform-box: view-box;
            transform-origin: 206px 144px
        }

        @keyframes sw {
            50% {
                transform: skewX(-2deg)
            }
        }

        .bq {
            animation: bqa 2.6s ease-in-out infinite;
            transform-box: view-box;
            transform-origin: 226px 214px
        }

        @keyframes bqa {
            50% {
                transform: rotate(8deg)
            }
        }
    </style>
</head>

  </div>
  <div class="kicker">The Wedding Of</div>
  <div class="names">${esc(CFG.groom)}<span class="amp">&amp;</span>${esc(CFG.bride)}</div>
  <div class="orn">❖ ❖ ❖</div>
  <div class="sub">${esc(CFG.intro)}</div>
  <div class="hint">Swipe up ↑</div>
  <div class="petals"></div>
</section>`;

        CFG.events.forEach(e => {
            h += `<section class="slide ${e.id === 'baraat' ? 'day' : 'night'} s-${e.id}">
  <div class="kicker">You are invited to</div>
  <div class="arch">
    <div class="urdu">${e.urdu}</div>
    <h2>${esc(e.name)}</h2>
    <div class="orn">✦ ✦ ✦</div>
    <div class="date">${esc(e.date)}</div>
    <div class="time">${esc(e.time)}</div>
    <div class="venue"><b>${esc(e.venue)}</b>${esc(e.address)}</div>
    ${e.map ? `<a class="btn" href="${esc(e.map)}" target="_blank" rel="noopener">View Map</a>` : ''}
    ${e.note ? `<div class="note">${esc(e.note)}</div>` : ''}
  </div>
  <div class="${e.id === 'baraat' ? 'petals' : 'stars'}"></div>
</section>`;
        });

        h += `<section class="slide day s-end">
  <div class="urdu bismillah">جزاک اللہ خیراً</div>
  <div class="sub">${esc(CFG.closing)}</div>
  <div class="orn">❖ ❖ ❖</div>
  <div class="names" style="font-size:38px">${esc(CFG.groom)} <span class="amp" style="display:inline;font-size:.7em">&amp;</span> ${esc(CFG.bride)}</div>
  ${CFG.contact ? `<a class="btn" href="tel:${esc(CFG.contact.replace(/[^0-9+]/g, ''))}">Call ${esc(CFG.contact)}</a>` : ''}
  <div class="petals"></div>
</section>`;

        deck.innerHTML = h;

        document.querySelectorAll('.petals').forEach(pt => {
            for (let i = 0; i < 14; i++) {
                const s = document.createElement('span');
                s.textContent = i % 3 ? '✿' : '♥';
                s.style.cssText = `left:${Math.random() * 100}%;animation-duration:${7 + Math.random() * 7}s;animation-delay:${-Math.random() * 12}s;font-size:${10 + Math.random() * 10}px;color:${i % 3 ? '#d4a93f' : '#c2334d'}`;
                pt.appendChild(s);
            }
        });
        document.querySelectorAll('.stars').forEach(st => {
            for (let i = 0; i < 60; i++) {
                const s = document.createElement('span'), z = 1 + Math.random() * 2.2;
                s.style.cssText = `left:${Math.random() * 100}%;top:${Math.random() * 100}%;width:${z}px;height:${z}px;animation:twk ${2 + Math.random() * 3}s ease-in-out ${-Math.random() * 5}s infinite,drift ${20 + Math.random() * 30}s linear ${-Math.random() * 30}s infinite alternate`;
                st.appendChild(s);
            }
            [['10%', '3s'], ['36%', '8s']].forEach(([t, d]) => { const m = document.createElement('i'); m.className = 'shoot'; m.style.cssText = `top:${t};left:70%;animation-delay:${d}`; st.appendChild(m); });
            const mn = document.createElement('b'); mn.className = 'moon'; st.appendChild(mn);
        });

        const slides = [...deck.querySelectorAll('.slide')];
        const dots = document.getElementById('dots');
        dots.innerHTML = slides.map(() => '<i></i>').join('');
        const dEls = [...dots.children];
        const io = new IntersectionObserver(es => es.forEach(en => {
            if (en.isIntersecting) {
                en.target.classList.add('in');
                const i = slides.indexOf(en.target);
                dEls.forEach((d, k) => d.classList.toggle('on', k === i));
            }
        }), { root: deck, threshold: 0.55 });
        slides.forEach(s => io.observe(s));
    </script>
</body>

</html>
